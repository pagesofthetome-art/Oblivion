;=============================================================================;
;                                                                             ;
; This is an optional INI file for: Basic Primary Needs                       ;
; (IT IS NOT REQUIRED FOR THIS ADDON TO WORK CORRECTLY)                       ;
;                                                                             ;
; Edit this file to add support for unrecognized objects. These are:          ;
; 1. Eat/drink hotkey tools (knife, fork, cup, mug, etc.)                     ;
; 2. Potions (beer bottle, ale bottle, etc.)                                  ;
; 3. Ingredients (bread, meat, etc.)                                          ;
; 4. Sleep activators (bed, coffin, etc.)                                     ;
; 5. Drink activators (well, fountain, etc.)                                  ;
;                                                                             ;
; Enable debug mode (BPN.ini_debug in Basic Primary Needs.ini) to display     ;
; object filenames in the console when activated/equipped.                    ;
;                                                                             ;
; Place this in your "Data" folder                                            ;
;                                                                             ;
;=============================================================================;
; Eat/drink hotkey tools						      ;
;=============================================================================;
; Add additional eat/drink hotkey tools by setting the object's filename and
; type. Finish every object with "SetStage" (see example below). Types:
; 1 == small drink container (cups, goblets, glasses, etc.)
; 2 == large drink container (mugs, tankards, etc.)
; 3 == eating tool (spoon, knife, fork, etc.)
;
; Example:
; 
; set BPN.ini_object_filename to sv_Construct "Clutter\MiddleClass\MiddleClassPewterCup01.NIF"
; set BPN.ini_object_type to 1
; SetStage BPN 10


;=============================================================================;
; Potions								      ;
;=============================================================================;
; Add optional effects to drinks by setting the object's filename and type.
; Finish every object with "SetStage" (see example below). Types:
; 11 == water
; 12 == alcohol
; 13 == caffeine
; 14 == blood
; 15 == cure disease
;
; Example:
; 
; set BPN.ini_object_filename to sv_Construct "clutter\Booze\beerbottle.nif"
; set BPN.ini_object_type to 12
; SetStage BPN 10


;=============================================================================;
; Ingredients								      ;
;=============================================================================;
; Add optional effects to food by setting the object's filename and type.
; Finish every object with "SetStage" (see example below). Types:
; 21 == contract disease
;
; Example:
; 
; set BPN.ini_object_filename to sv_Construct "Clutter\IngredBoarMeat.NIF"
; set BPN.ini_object_type to 21
; SetStage BPN 10


;=============================================================================;
; Sleep activators							      ;
;=============================================================================;
; Add quality to a bed by setting the object's filename and type. Note that
; coffins are containers rather than beds.
; Finish every object with "SetStage" (see example below). Types:
; 31 == lowerclass bedroll
; 32 == middleclass bedroll
; 33 == upperclass bedroll
; 34 == lowerclass bed
; 35 == middleclass bed
; 36 == upperclass bed
; 37 == lowerclass coffin
; 38 == middleclass coffin
; 39 == upperclass coffin
;
; Example:
;
; set BPN.ini_object_filename to sv_Construct "Architecture\Tents\SleepingMat01.NIF"
; set BPN.ini_object_type to 31
; SetStage BPN 10


;=============================================================================;
; Drink activators							      ;
;=============================================================================;
; Add drink sources found outdoors (wells, fountains, etc.) by setting the
; object's filename, in-game name and type. The in-game name will be added
; when "converting static objects" is enabled in Basic Primary Needs.ini.
; Finish every object with "SetStage" (see example below). Types:
; 41 == water
; 42 == ale
; 43 == beer
; 44 == mead
; 45 == wine
; 46 == blood
; 47 == milk
;
; Example:
;
; set BPN.ini_object_filename to sv_Construct "Architecture\kvatch\KvatchStoneWell01.NIF"
; set BPN.ini_object_name to sv_Construct "Well"
; set BPN.ini_object_type to 41
; SetStage BPN 10


;=============================================================================;
; ADDED for this load order (Oblivion Rebirth+) - see Games\Mods\BPN-compat ;
;=============================================================================;
; Alcohol (type 12). BPN knows vanilla drinks by ID (so Alluring Wine Bottles is
; fine) and other alcohol by '\winebottle'/'\meadbottle'... in the model path.
; These drinks match neither:

; Shivering Isles Mead (SE39DrinkMead) - shares this bottle model with vanilla Mead
set BPN.ini_object_filename to sv_Construct "clutter\Wines\Mead01.nif"
set BPN.ini_object_type to 12
SetStage BPN 10

; Spiced Wine (Skyrim Ingredients)
set BPN.ini_object_filename to sv_Construct "Clutter\skImports\spicedwinebottle03.nif"
set BPN.ini_object_type to 12
SetStage BPN 10

; Alto Wine (Skyrim Ingredients)
set BPN.ini_object_filename to sv_Construct "Clutter\skImports\AltoWine.nif"
set BPN.ini_object_type to 12
SetStage BPN 10

